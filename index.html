<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0B10" />
    <meta
      name="description"
      content="DGO 2026/27 — Modelação, análise e otimização do rover Perseverance, subsistema a subsistema. Universidade de Aveiro."
    />
    <title>Perseverance, peça a peça · DGO 2026/27</title>
    <link rel="icon" type="image/svg+xml" href="./media/logo/favicon.svg" />
  </head>
  <body>
    <a class="skip" href="#conteudo">Saltar para o conteúdo</a>
    <div class="progress" aria-hidden="true"><i id="progress-bar"></i></div>
    <header class="topbar" id="topbar"></header>

    <main id="conteudo" tabindex="-1">

      <section id="objetivo" class="sec dark" aria-labelledby="objetivo-t"></section>
      <div id="projeto" class="projeto">

        <section id="porque" class="sec light grid-mm" aria-labelledby="porque-t"></section>
        <section id="m0" class="sec dark" aria-labelledby="m0-t"></section>
        <section id="m1" class="sec light grid-mm" aria-labelledby="m1-t"></section>
        <section id="m2" class="sec dark" aria-labelledby="m2-t"></section>
      </div>
      <section id="equipa" class="sec light grid-mm" aria-labelledby="equipa-t"></section>
    </main>

    <footer id="rodape" class="footer dark"></footer>
    <div id="egg" class="egg" role="dialog" aria-modal="true" aria-labelledby="egg-t" hidden></div>

    <noscript>
      <p class="noscript">Este website precisa de JavaScript para mostrar o conteúdo e o modelo 3D.</p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
